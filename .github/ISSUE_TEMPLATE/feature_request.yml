name: Feature or learning-module request
description: Suggest a new example, module, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to learn or do?
      description: Describe the goal or the gap in the current examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Libraries, datasets, or models involved, if any.
  - type: textarea
    id: licensing
    attributes:
      label: Licensing and data notes
      description: If this adds a model or dataset, link its license and terms of use.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
